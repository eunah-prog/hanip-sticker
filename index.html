/* 레이아웃: 휴대폰 한 화면 — 위 날짜, 가운데 모눈 다이어리 판, 아래 끼니 고르기와 사진 버튼 */
:root {
  --font: 'Pretendard','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
  --bg: #f3f5f9;
  --paper: #ffffff;
  --grid: #e6ebf3;
  --ink: #1b2230;
  --sub: #6b7486;
  --line: #dfe4ec;
  --accent: #3182f6;
  --accent-ink: #ffffff;
  --m-breakfast: #f0a01a;
  --m-lunch: #1fa774;
  --m-dinner: #7a5af8;
  --m-snack: #e8488a;
  --danger: #d9473b;
  --shade: rgba(20, 28, 45, .45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --paper: #1b1f27; --grid: #262c37; --ink: #eef1f6; --sub: #9aa3b4;
    --line: #2d3441; --accent: #4b93ff; --shade: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --paper: #1b1f27; --grid: #262c37; --ink: #eef1f6; --sub: #9aa3b4;
  --line: #2d3441; --accent: #4b93ff; --shade: rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 14px;
  padding-block: 18px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.day { display: flex; flex-direction: column; min-width: 0; }
.day h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.day p { margin: 0; color: var(--sub); font-size: 13px; font-weight: 500; }
.nav { display: flex; gap: 6px; }
.iconbtn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; cursor: pointer;
}
.iconbtn:disabled { opacity: .35; cursor: default; }

.board {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4;
  border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px; background-position: -1px -1px;
  touch-action: none; user-select: none;
}
.empty {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; text-align: center;
  color: var(--sub); font-size: 14px; padding: 24px; pointer-events: none;
}
.empty b { color: var(--ink); font-size: 16px; font-weight: 600; }
.stk {
  position: absolute; transform-origin: center; cursor: grab; touch-action: none;
}
.stk img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
.stk .tag {
  position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%);
  font-size: 11px; font-weight: 600; color: #fff; padding: 1px 8px; border-radius: 999px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.stk.sel { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 10px; z-index: 50; }

.tools { display: flex; gap: 8px; justify-content: center; }
.tools[hidden] { display: none; }
.chipbtn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}
.chipbtn.danger { color: var(--danger); }

.meals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.meal {
  border: 1.5px solid var(--line); background: var(--paper); color: var(--sub);
  border-radius: 12px; padding: 9px 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.meal[aria-pressed="true"] { color: #fff; border-color: transparent; background: var(--mc); }
.shoot {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: var(--accent-ink); border-radius: 14px;
  padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; border: 0; width: 100%; font-family: inherit;
}
.shoot:focus-within, .iconbtn:focus-visible, .meal:focus-visible, .chipbtn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); outline-offset: 2px; }
.shoot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.secondary { display: flex; gap: 8px; }
.secondary .chipbtn { flex: 1; padding: 11px; border-radius: 12px; }
.log { font-size: 12px; color: var(--sub); text-align: center; font-variant-numeric: tabular-nums; min-height: 18px; }

.sheet-bg { position: fixed; inset: 0; background: var(--shade); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 460px; background: var(--paper); border-radius: 20px 20px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.sheet h2 { margin: 0; font-size: 18px; font-weight: 700; }
.stage {
  height: 260px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  background-color: var(--bg);
  background-image: conic-gradient(var(--grid) 25%, transparent 0 50%, var(--grid) 0 75%, transparent 0);
  background-size: 20px 20px;
}
.stage img { max-height: 240px; max-width: 90%; }
.working { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--sub); font-size: 14px; text-align: center; padding: 0 16px; }
.spin { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.timing { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.row .shoot { padding: 13px; }
.export-img { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
.export-story { width: auto; max-width: 100%; max-height: 52vh; display: block; margin: 0 auto; }
.hint { margin: 0; font-size: 13px; color: var(--sub); }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 200;
  max-width: calc(100% - 32px);
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="day">
      <h1 id="dayTitle">11월 27일 목요일</h1>
      <p id="daySum">아직 붙인 스티커가 없어요</p>
    </div>
    <div class="nav">
      <button class="iconbtn" id="prevDay" aria-label="전날 보기">‹</button>
      <button class="iconbtn" id="nextDay" aria-label="다음 날 보기">›</button>
    </div>
  </header>

  <div class="board" id="board">
    <div class="empty" id="empty"><b>오늘 첫 끼를 찍어 보세요</b>사진에서 음식만 오려 스티커로 붙여 드려요. 붙인 뒤에는 끌어서 옮길 수 있어요.</div>
  </div>

  <div class="tools" id="tools" hidden>
    <button class="chipbtn" id="smaller">작게</button>
    <button class="chipbtn" id="bigger">크게</button>
    <button class="chipbtn" id="turn">돌리기</button>
    <button class="chipbtn danger" id="remove">떼기</button>
  </div>

  <div class="meals" role="group" aria-label="끼니">
    <button class="meal" data-meal="breakfast" style="--mc: var(--m-breakfast)">아침</button>
    <button class="meal" data-meal="lunch" style="--mc: var(--m-lunch)">점심</button>
    <button class="meal" data-meal="dinner" style="--mc: var(--m-dinner)">저녁</button>
    <button class="meal" data-meal="snack" style="--mc: var(--m-snack)">간식</button>
  </div>

  <label class="shoot" for="photo">사진으로 스티커 만들기
    <input type="file" id="photo" accept="image/*">
  </label>

  <div class="secondary">
    <button class="chipbtn" id="exportBtn">오늘 다이어리 이미지로 보기</button>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">스티커 만드는 중</h2>
    <div class="stage" id="stage"></div>
    <div class="timing" id="timing"></div>
    <div class="row" id="sheetBtns"></div>
  </div>
</div>

<script type="module">
const MEALS = {
  breakfast: { name: '아침', color: '--m-breakfast' },
  lunch: { name: '점심', color: '--m-lunch' },
  dinner: { name: '저녁', color: '--m-dinner' },
  snack: { name: '간식', color: '--m-snack' },
};
const WEEK = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
const $ = (id) => document.getElementById(id);
const board = $('board');

/* ---------- 날짜와 저장 ---------- */
const pad2 = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
let day = new Date(); day.setHours(0, 0, 0, 0);
let stickers = [];
let selected = null;
let meal = guessMeal();

function guessMeal() {
  const h = new Date().getHours();
  if (h < 10) return 'breakfast';
  if (h < 15) return 'lunch';
  if (h < 21) return 'dinner';
  return 'snack';
}
function load() {
  try { stickers = JSON.parse(localStorage.getItem('hanip:' + keyOf(day)) || '[]'); }
  catch { stickers = []; }
}
function save() {
  try { localStorage.setItem('hanip:' + keyOf(day), JSON.stringify(stickers)); return true; }
  catch { toast('이 기기에 저장할 공간이 부족해요. 오래된 날짜를 지워 주세요.'); return false; }
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- 다이어리 그리기 ---------- */
function render() {
  $('dayTitle').textContent = `${day.getMonth() + 1}월 ${day.getDate()}일 ${WEEK[day.getDay()]}`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  $('nextDay').disabled = day >= today;
  const counts = {};
  stickers.forEach((s) => { counts[s.meal] = (counts[s.meal] || 0) + 1; });
  $('daySum').textContent = stickers.length
    ? Object.keys(MEALS).filter((m) => counts[m]).map((m) => `${MEALS[m].name} ${counts[m]}`).join(' · ')
    : '아직 붙인 스티커가 없어요';
  board.querySelectorAll('.stk').forEach((n) => n.remove());
  $('empty').hidden = stickers.length > 0;
  stickers.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'stk' + (s.id === selected ? ' sel' : '');
    el.dataset.id = s.id;
    el.style.left = (s.x * 100) + '%';
    el.style.top = (s.y * 100) + '%';
    el.style.width = (s.w * 100) + '%';
    el.style.transform = `translate(-50%, -50%) rotate(${s.rot}deg)`;
    el.style.zIndex = String(10 + i);
    const img = document.createElement('img'); img.src = s.src; img.alt = MEALS[s.meal].name + ' 스티커';
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.style.background = `var(${MEALS[s.meal].color})`; tag.textContent = `${MEALS[s.meal].name} ${s.time}`;
    el.append(img, tag);
    board.appendChild(el);
  });
  $('tools').hidden = !selected;
}
function setDay(delta) { day.setDate(day.getDate() + delta); selected = null; load(); render(); }
$('prevDay').onclick = () => setDay(-1);
$('nextDay').onclick = () => setDay(1);

/* ---------- 끌어 옮기기 ---------- */
let drag = null;
board.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.stk');
  if (!el) { selected = null; render(); return; }
  const s = stickers.find((x) => x.id === el.dataset.id);
  selected = s.id;
  // 잡은 스티커를 맨 위로
  stickers = stickers.filter((x) => x !== s).concat(s);
  render();
  const r = board.getBoundingClientRect();
  drag = { s, r, sx: e.clientX, sy: e.clientY, ox: s.x, oy: s.y, moved: false };
  board.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const { s, r } = drag;
  s.x = Math.min(0.98, Math.max(0.02, drag.ox + (e.clientX - drag.sx) / r.width));
  s.y = Math.min(0.98, Math.max(0.02, drag.oy + (e.clientY - drag.sy) / r.height));
  const el = board.querySelector(`.stk[data-id="${s.id}"]`);
  if (el) { el.style.left = (s.x * 100) + '%'; el.style.top = (s.y * 100) + '%'; }
  drag.moved = true;
});
const endDrag = () => { if (drag) { if (drag.moved) save(); drag = null; } };
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', endDrag);

const sel = () => stickers.find((x) => x.id === selected);
$('smaller').onclick = () => { const s = sel(); if (s) { s.w = Math.max(0.16, s.w * 0.85); save(); render(); } };
$('bigger').onclick = () => { const s = sel(); if (s) { s.w = Math.min(0.9, s.w * 1.15); save(); render(); } };
$('turn').onclick = () => { const s = sel(); if (s) { s.rot = ((s.rot + 15 + 180) % 360) - 180; save(); render(); } };
$('remove').onclick = () => { stickers = stickers.filter((x) => x.id !== selected); selected = null; save(); render(); };

/* ---------- 끼니 ---------- */
function paintMeals() {
  document.querySelectorAll('.meal').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.meal === meal)));
}
document.querySelectorAll('.meal').forEach((b) => { b.onclick = () => { meal = b.dataset.meal; paintMeals(); }; });

/* ---------- 이미지 도우미 ---------- */
const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// 큰 사진은 먼저 줄인다 — 휴대폰 원본(4000px)을 그대로 넣으면 느리다
async function shrink(blob, max = 1024) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await loadImg(url);
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = canvas(Math.round(img.naturalWidth * k), Math.round(img.naturalHeight * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.92));
  } finally { URL.revokeObjectURL(url); }
}

let lastWarn = false;
// 오려내기 결과 정리
// 도구는 배경에 눈에 안 보이는 옅은 막(투명도 1~40)을 남긴다. 그대로 두면 흰 테두리를 겹쳐 그릴 때
// 옅은 막이 진해져 흰 안개가 된다. 옅은 부분을 지우고, 본체에서 떨어진 작은 조각도 버린다.
function cleanMask(a, W, H) {
  const N = W * H, LO = 96, HI = 200;
  const solid = new Uint8Array(N);
  let faint = 0, visible = 0;
  for (let p = 0; p < N; p++) {
    const v = a[p * 4 + 3];
    if (v > 40) { visible++; if (v < 192) faint++; }
    const nv = v <= LO ? 0 : v >= HI ? 255 : Math.round((v - LO) / (HI - LO) * 255);
    a[p * 4 + 3] = nv;
    if (nv >= 128) solid[p] = 1;
  }
  // 또렷한 픽셀을 이어진 덩어리끼리 묶는다 (상하좌우)
  const label = new Int32Array(N), stack = new Int32Array(N), sizes = [0];
  for (let p = 0; p < N; p++) {
    if (!solid[p] || label[p]) continue;
    const id = sizes.length; let top = 0, n = 0;
    stack[top++] = p; label[p] = id;
    while (top) {
      const q = stack[--top]; n++;
      const qx = q % W;
      if (qx > 0 && solid[q - 1] && !label[q - 1]) { label[q - 1] = id; stack[top++] = q - 1; }
      if (qx < W - 1 && solid[q + 1] && !label[q + 1]) { label[q + 1] = id; stack[top++] = q + 1; }
      if (q >= W && solid[q - W] && !label[q - W]) { label[q - W] = id; stack[top++] = q - W; }
      if (q < N - W && solid[q + W] && !label[q + W]) { label[q + W] = id; stack[top++] = q + W; }
    }
    sizes.push(n);
  }
  let biggest = 0, total = 0;
  for (const n of sizes) { total += n; if (n > biggest) biggest = n; }
  // 가장 큰 덩어리의 15% 이상인 덩어리만 남긴다 (반찬 여러 개가 한 접시에 있을 때를 위해 하나만 남기지 않음)
  const minSize = Math.max(biggest * 0.15, N * 0.002);
  let near = new Uint8Array(N), kept = 0;
  for (let p = 0; p < N; p++) if (label[p] && sizes[label[p]] >= minSize) { near[p] = 1; kept++; }
  // 가장자리의 부드러운 픽셀은 남긴 덩어리에서 2px 안쪽만 살린다
  for (let r = 0; r < 2; r++) {
    const nx = near.slice();
    for (let p = 0; p < N; p++) {
      if (near[p]) continue;
      const px = p % W;
      if ((px > 0 && near[p - 1]) || (px < W - 1 && near[p + 1]) || (p >= W && near[p - W]) || (p < N - W && near[p + W])) nx[p] = 1;
    }
    near = nx;
  }
  for (let p = 0; p < N; p++) if (!near[p]) a[p * 4 + 3] = 0;
  return { any: kept > 0, keptShare: total ? kept / total : 0, faintShare: visible ? faint / visible : 1 };
}

// 배경이 지워진 PNG → 흰 테두리 스티커 (dataURL)
async function toSticker(cutBlob) {
  const url = URL.createObjectURL(cutBlob);
  const img = await loadImg(url);
  URL.revokeObjectURL(url);
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = canvas(W, H); const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  const id = x.getImageData(0, 0, W, H); const a = id.data;
  const m = cleanMask(a, W, H);
  if (!m.any) throw new Error('empty');
  x.putImageData(id, 0, 0);
  // 정리가 많이 일어났으면 음식을 제대로 못 잡은 사진이다
  lastWarn = m.keptShare < 0.6 || m.faintShare > 0.5;
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) {
    if (a[(y * W + i) * 4 + 3] > 0) { if (i < minX) minX = i; if (i > maxX) maxX = i; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const k = Math.min(1, 360 / Math.max(bw, bh));
  const w = Math.round(bw * k), h = Math.round(bh * k);
  const crop = canvas(w, h); crop.getContext('2d').drawImage(c, minX, minY, bw, bh, 0, 0, w, h);
  // 테두리용 실루엣은 반투명 없이 흰색/투명 두 가지로만 만든다 — 겹쳐 그려도 번지지 않게
  const sil = canvas(w, h); const sx = sil.getContext('2d');
  const sd = crop.getContext('2d').getImageData(0, 0, w, h); const d = sd.data;
  for (let i = 0; i < d.length; i += 4) { const on = d[i + 3] >= 128; d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = on ? 255 : 0; }
  sx.putImageData(sd, 0, 0);
  const P = 16, R = 9;
  const ring = canvas(w + P * 2, h + P * 2); const rx = ring.getContext('2d');
  for (let t = 0; t < Math.PI * 2; t += Math.PI / 16) rx.drawImage(sil, P + Math.cos(t) * R, P + Math.sin(t) * R);
  rx.drawImage(sil, P, P);
  const out = canvas(ring.width, ring.height); const ox = out.getContext('2d');
  ox.shadowColor = 'rgba(20,28,45,0.22)'; ox.shadowBlur = 8; ox.shadowOffsetY = 3;
  ox.drawImage(ring, 0, 0);
  ox.shadowColor = 'transparent';
  ox.drawImage(crop, P, P);
  return out.toDataURL('image/png');
}

/* ---------- 배경 제거 (기기 안에서 실행) ---------- */
let lib = null, modelReady = false;
async function cutOut(blob, onProgress) {
  if (!lib) lib = await import('https://esm.sh/@imgly/background-removal@1.4.5');
  return lib.removeBackground(blob, {
    model: 'small',
    output: { format: 'image/png' },
    progress: (key, cur, total) => { if (key.startsWith('fetch')) onProgress?.(cur / total); },
  });
}

/* ---------- 시트 ---------- */
let pending = null;
function openSheet(title) { $('sheetTitle').textContent = title; $('sheetBg').hidden = false; }
function closeSheet() { $('sheetBg').hidden = true; $('stage').innerHTML = ''; $('sheetBtns').innerHTML = ''; $('timing').textContent = ''; }
function btn(label, cls, fn) { const b = document.createElement('button'); b.className = cls; b.textContent = label; b.onclick = fn; return b; }

async function makeSticker(file) {
  openSheet('스티커 만드는 중');
  const first = !modelReady;
  $('stage').innerHTML = `<div class="working"><div class="spin"></div><span id="wmsg">${first ? '처음 한 번은 오려내기 도구를 받느라 시간이 걸려요' : '음식만 오려내는 중이에요'}</span></div>`;
  $('sheetBtns').replaceChildren(btn('그만두기', 'chipbtn', closeSheet));
  const t0 = performance.now();
  try {
    const small = await shrink(file);
    const cut = await cutOut(small, (p) => { const m = $('wmsg'); if (m) m.textContent = `오려내기 도구 받는 중 ${Math.round(p * 100)}%`; });
    const t1 = performance.now();
    const src = await toSticker(cut);
    modelReady = true;
    const sec = ((t1 - t0) / 1000).toFixed(1);
    $('log').textContent = `마지막 오려내기 ${sec}초${first ? ' (도구 받기 포함)' : ''}`;
    if ($('sheetBg').hidden) return;
    $('sheetTitle').textContent = '이렇게 붙일까요?';
    $('stage').innerHTML = ''; const im = document.createElement('img'); im.src = src; im.alt = '만든 스티커'; $('stage').appendChild(im);
    $('timing').textContent = (lastWarn ? '음식이 흐릿하게 잡혔어요. 여러 접시가 함께 찍혔다면 한 접시씩 가까이 찍어 보세요. · ' : '')
      + `걸린 시간 ${sec}초${first ? ' · 도구 받기 포함, 다음부터는 더 빨라요' : ''}`;
    pending = src;
    $('sheetBtns').replaceChildren(
      btn('다시 고르기', 'chipbtn', () => { closeSheet(); $('photo').click(); }),
      btn(`${MEALS[meal].name}에 붙이기`, 'shoot', addPending),
    );
  } catch (err) {
    console.error(err);
    $('sheetTitle').textContent = '음식을 찾지 못했어요';
    $('stage').innerHTML = `<div class="working">${err && err.message === 'empty' ? '사진에서 음식을 구분하지 못했어요. 접시가 가운데 오게 다시 찍어 주세요.' : '오려내기 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.'}</div>`;
    $('sheetBtns').replaceChildren(btn('닫기', 'chipbtn', closeSheet));
  }
}
function addPending() {
  const now = new Date();
  const n = stickers.length;
  const s = {
    id: Math.random().toString(36).slice(2, 9), src: pending, meal,
    time: `${pad2(now.getHours())}:${pad2(now.getMinutes())}`,
    x: 0.3 + (n % 2) * 0.4 + (Math.random() - 0.5) * 0.08,
    y: 0.2 + (Math.floor(n / 2) % 3) * 0.3 + (Math.random() - 0.5) * 0.06,
    w: 0.4, rot: Math.round((Math.random() - 0.5) * 16),
  };
  stickers.push(s); selected = null;
  if (!save()) stickers.pop();
  closeSheet(); render();
}
$('photo').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) makeSticker(f); });
$('sheetBg').addEventListener('click', (e) => { if (e.target === $('sheetBg')) closeSheet(); });

/* ---------- 하루 다이어리를 한 장 이미지로 ---------- */
// 인스타 스토리 비율 1080×1920: 위 날짜, 가운데 3:4 다이어리, 아래 앱 이름
async function exportBoard() {
  const W = 1080, H = 1920;
  const BX = 60, BY = 250, BW = 960, BH = 1280;
  const c = canvas(W, H); const x = c.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const v = (n) => css.getPropertyValue(n).trim();
  x.fillStyle = '#f3f5f9'; x.fillRect(0, 0, W, H);
  x.save();
  x.beginPath(); x.roundRect(BX, BY, BW, BH, 40); x.fillStyle = '#ffffff'; x.fill(); x.clip();
  x.strokeStyle = '#e6ebf3'; x.lineWidth = 2;
  for (let i = BX; i <= BX + BW; i += 48) { x.beginPath(); x.moveTo(i, BY); x.lineTo(i, BY + BH); x.stroke(); }
  for (let j = BY; j <= BY + BH; j += 48) { x.beginPath(); x.moveTo(BX, j); x.lineTo(BX + BW, j); x.stroke(); }
  x.restore();
  for (const s of stickers) {
    const img = await loadImg(s.src);
    const w = s.w * BW, h = w * img.naturalHeight / img.naturalWidth;
    x.save(); x.translate(BX + s.x * BW, BY + s.y * BH); x.rotate(s.rot * Math.PI / 180);
    x.drawImage(img, -w / 2, -h / 2, w, h);
    const label = `${MEALS[s.meal].name} ${s.time}`;
    x.font = `600 30px ${v('--font')}`;
    const tw = x.measureText(label).width + 36;
    x.fillStyle = v(MEALS[s.meal].color);
    x.beginPath(); x.roundRect(-tw / 2, h / 2 - 30, tw, 46, 23); x.fill();
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(label, 0, h / 2 - 7);
    x.restore();
  }
  x.fillStyle = '#1b2230'; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.font = `700 64px ${v('--font')}`; x.fillText($('dayTitle').textContent, BX, 190);
  x.fillStyle = '#6b7486'; x.font = `500 36px ${v('--font')}`; x.fillText('한입 스티커', BX, BY + BH + 90);
  return c.toDataURL('image/png');
}
// 휴대폰 공유창으로 이미지 파일을 넘긴다 — 인스타그램을 고르면 스토리로 올릴 수 있다
async function shareImage(src) {
  const blob = await (await fetch(src)).blob();
  const file = new File([blob], `한입스티커_${keyOf(day)}.png`, { type: 'image/png' });
  if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
    toast('이 화면에서는 공유창을 열 수 없어요. 이미지를 길게 눌러 저장해 주세요.');
    return;
  }
  try { await navigator.share({ files: [file] }); }
  catch (err) { if (err && err.name !== 'AbortError') toast('공유하지 못했어요. 이미지를 길게 눌러 저장해 주세요.'); }
}
$('exportBtn').onclick = async () => {
  if (!stickers.length) { toast('먼저 스티커를 하나 붙여 주세요'); return; }
  openSheet('오늘 다이어리');
  const src = await exportBoard();
  $('stage').style.height = 'auto';
  $('stage').innerHTML = `<img class="export-img export-story" src="${src}" alt="오늘 먹은 음식 스티커 다이어리">`;
  $('timing').innerHTML = '<p class="hint">공유하기에서 인스타그램을 고르면 스토리로 올릴 수 있어요. 휴대폰에서는 이미지를 길게 눌러 저장할 수도 있어요.</p>';
  const a = document.createElement('a'); a.href = src; a.download = `한입스티커_${keyOf(day)}.png`; a.className = 'chipbtn'; a.textContent = '파일로 받기'; a.style.textAlign = 'center'; a.style.textDecoration = 'none';
  const close = btn('닫기', 'chipbtn', () => { $('stage').style.height = ''; closeSheet(); });
  $('sheetBtns').replaceChildren(btn('공유하기', 'shoot', () => shareImage(src)), a, close);
};

/* 시험용: 브라우저 자동 점검에서 사진 주소로 바로 돌려 본다 */
window.__hanip = { makeSticker, addPending, exportBoard, get stickers() { return stickers; } };

load(); paintMeals(); render();
</script>
</body>
</html>
