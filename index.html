/* 디자인 값은 k-style-ui-ux 시안(out/tokens.css · components.css · screens/*.html)에서 옮겨 왔다 */
:root {
  --font: 'Pretendard','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
  --c-bg: #F3F4F5; --c-surface: #FFFFFF; --c-line: #EEEFF1; --c-line-strong: #BFBFC1; --c-fill: #EEEFF1;
  --c-text-1: #1A1C20; --c-text-2: #4C4E51; --c-text-3: #555D6D; --c-text-disabled: #9FA0A1;
  --c-brand: #E14D00; --c-on-brand: #FFFFFF; --c-brand-text: #B93901; --c-brand-tint: #FFE8DB;
  --c-danger: #CA1D13; --c-danger-tint: #FDF0F0; --c-warning-text: #8C7000; --c-warning-tint: #FFF6D6;
  --c-info-text: #135FCD; --c-info-tint: #EAF2FE; --c-success-text: #00745F; --c-success-tint: #E3F6F1;
  --c-overlay: rgba(26, 28, 32, .45); --shadow-2: 0 2px 10px rgba(0,0,0,.1);
  --fs-title: 26px; --fs-h2: 20px; --fs-body: 16px; --fs-sub: 14px; --fs-caption: 12px;
  --page-x: 24px; --block-pad: 20px; --s: 8px; --m: 16px; --l: 32px;
  --r-s: 4px; --r-m: 8px; --r-l: 16px; --r-pill: 999px; --h-btn: 52px; --h-appbar: 56px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--c-bg); color: var(--c-text-1); font-family: var(--font); font-size: var(--fs-body); line-height: 1.5; letter-spacing: -0.02em; word-break: keep-all; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; letter-spacing: inherit; }
button { border: 0; background: none; color: inherit; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 460px; margin: 0 auto; }

/* 공통 부품 */
.hero { padding: var(--l) var(--page-x) var(--m); display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: var(--fs-sub); font-weight: 600; color: var(--c-text-2); font-variant-numeric: tabular-nums; }
.title { margin: 0; font-size: var(--fs-title); font-weight: 700; line-height: 1.3; letter-spacing: -0.03em; text-wrap: balance; }
.lead { margin: 0; font-size: var(--fs-body); color: var(--c-text-2); }
.page { display: flex; flex-direction: column; gap: 12px; padding-bottom: var(--l); }
.block { background: var(--c-surface); margin: 0 var(--m); border-radius: var(--r-l); padding: var(--block-pad); display: flex; flex-direction: column; gap: 12px; }
.h2 { margin: 0; font-size: var(--fs-h2); font-weight: 700; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s); height: var(--h-btn); padding: 0 var(--block-pad); border-radius: var(--r-m); font-size: var(--fs-body); font-weight: 600; position: relative; overflow: hidden; }
.btn.primary { background: var(--c-brand); color: var(--c-on-brand); }
.btn.secondary { background: var(--c-surface); color: var(--c-text-1); box-shadow: inset 0 0 0 1px var(--c-line); }
.btn.small { height: 40px; padding: 0 var(--m); font-size: var(--fs-sub); }
.btn.full { width: 100%; }
.btn:disabled { background: var(--c-fill); color: var(--c-text-disabled); box-shadow: none; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .day:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--c-brand-text); outline-offset: 2px; }
.btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.badge { display: inline-flex; align-items: center; height: 22px; padding: 0 var(--s); border-radius: var(--r-s); font-size: var(--fs-caption); font-weight: 600; white-space: nowrap; }
.badge.is-brand { background: var(--c-brand-tint); color: var(--c-brand-text); }
.badge.is-info { background: var(--c-info-tint); color: var(--c-info-text); }
.badge.is-warning { background: var(--c-warning-tint); color: var(--c-warning-text); }
.badge.is-success { background: var(--c-success-tint); color: var(--c-success-text); }
.chips { display: flex; gap: var(--s); flex-wrap: wrap; }
.chip { height: 40px; padding: 0 var(--m); border-radius: var(--r-pill); background: var(--c-surface); box-shadow: inset 0 0 0 1px var(--c-line-strong); font-size: var(--fs-sub); font-weight: 600; color: var(--c-text-1); }
.chip[aria-pressed="true"] { background: var(--c-text-1); color: var(--c-surface); box-shadow: none; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--c-text-1); border-radius: var(--r-m); }
.icon-btn:disabled { color: var(--c-text-disabled); cursor: default; }
.note { display: flex; gap: var(--s); align-items: flex-start; font-size: var(--fs-sub); color: var(--c-text-2); margin: 0; }
.note svg { flex: none; width: 20px; height: 20px; }
.note.is-warn { color: var(--c-text-1); }
.note.is-warn svg { color: var(--c-danger); }
.appbar { position: sticky; top: 0; z-index: 5; height: var(--h-appbar); display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 0 var(--s); background: var(--c-bg); }
.appbar-title { margin: 0; text-align: center; font-size: var(--fs-body); font-weight: 600; }
.cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: var(--m) var(--m) calc(var(--m) + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--c-bg) 75%, rgba(243,244,245,0)); }
.cta-in { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s); }
.has-cta { padding-bottom: 170px; }

/* 오늘 다이어리: 날짜 블록 */
.week-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s); }
.week-date { display: flex; align-items: center; gap: var(--s); font-size: var(--fs-h2); font-weight: 700; letter-spacing: -0.03em; }
.week-note { font-size: var(--fs-sub); color: var(--c-text-2); margin: 0; font-variant-numeric: tabular-nums; }
.dl { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; border-radius: var(--r-pill); background: var(--c-line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: var(--r-pill); background: var(--c-text-1); transition: width .3s; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); touch-action: pan-y; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 64px; }
.day-w { font-size: var(--fs-caption); color: var(--c-text-3); }
.day-n { width: 36px; height: 36px; border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.day.is-sel .day-n { background: var(--c-text-1); color: var(--c-surface); }
.day.is-today:not(.is-sel) .day-n { box-shadow: inset 0 0 0 1.5px var(--c-text-1); }
.day:disabled .day-n { color: var(--c-text-disabled); font-weight: 400; }
.day-dot { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--c-text-1); }
.day-dot.is-off { visibility: hidden; }

/* 모눈 다이어리와 스티커 */
.board { position: relative; margin: 0 var(--m); aspect-ratio: 3 / 4; border-radius: var(--r-l); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--c-surface);
  background-image: linear-gradient(var(--c-line) 1px, transparent 1px), linear-gradient(90deg, var(--c-line) 1px, transparent 1px);

<script type="module">
/* ---------- 이미지 도우미 ---------- */
const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// 큰 사진은 먼저 줄인다 — 휴대폰 원본(4000px)을 그대로 넣으면 느리다
async function shrink(blob, max = 1024) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await loadImg(url);
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = canvas(Math.round(img.naturalWidth * k), Math.round(img.naturalHeight * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.92));
  } finally { URL.revokeObjectURL(url); }
}

let lastWarn = false;
// 오려내기 결과 정리
// 도구는 배경에 눈에 안 보이는 옅은 막(투명도 1~40)을 남긴다. 그대로 두면 흰 테두리를 겹쳐 그릴 때
// 옅은 막이 진해져 흰 안개가 된다. 옅은 부분을 지우고, 본체에서 떨어진 작은 조각도 버린다.
function cleanMask(a, W, H) {
  const N = W * H, LO = 96, HI = 200;
  const solid = new Uint8Array(N);
  let faint = 0, visible = 0;
  for (let p = 0; p < N; p++) {
    const v = a[p * 4 + 3];
    if (v > 40) { visible++; if (v < 192) faint++; }
    const nv = v <= LO ? 0 : v >= HI ? 255 : Math.round((v - LO) / (HI - LO) * 255);
    a[p * 4 + 3] = nv;
    if (nv >= 128) solid[p] = 1;
  }
  // 또렷한 픽셀을 이어진 덩어리끼리 묶는다 (상하좌우)
  const label = new Int32Array(N), stack = new Int32Array(N), sizes = [0];
  for (let p = 0; p < N; p++) {
    if (!solid[p] || label[p]) continue;
    const id = sizes.length; let top = 0, n = 0;
    stack[top++] = p; label[p] = id;
    while (top) {
      const q = stack[--top]; n++;
      const qx = q % W;
      if (qx > 0 && solid[q - 1] && !label[q - 1]) { label[q - 1] = id; stack[top++] = q - 1; }
      if (qx < W - 1 && solid[q + 1] && !label[q + 1]) { label[q + 1] = id; stack[top++] = q + 1; }
      if (q >= W && solid[q - W] && !label[q - W]) { label[q - W] = id; stack[top++] = q - W; }
      if (q < N - W && solid[q + W] && !label[q + W]) { label[q + W] = id; stack[top++] = q + W; }
    }
    sizes.push(n);
  }
  let biggest = 0, total = 0;
  for (const n of sizes) { total += n; if (n > biggest) biggest = n; }
  // 가장 큰 덩어리의 15% 이상인 덩어리만 남긴다 (반찬 여러 개가 한 접시에 있을 때를 위해 하나만 남기지 않음)
  const minSize = Math.max(biggest * 0.15, N * 0.002);
  let near = new Uint8Array(N), kept = 0;
  for (let p = 0; p < N; p++) if (label[p] && sizes[label[p]] >= minSize) { near[p] = 1; kept++; }
  // 가장자리의 부드러운 픽셀은 남긴 덩어리에서 2px 안쪽만 살린다
  for (let r = 0; r < 2; r++) {
    const nx = near.slice();
    for (let p = 0; p < N; p++) {
      if (near[p]) continue;
      const px = p % W;
      if ((px > 0 && near[p - 1]) || (px < W - 1 && near[p + 1]) || (p >= W && near[p - W]) || (p < N - W && near[p + W])) nx[p] = 1;
    }
    near = nx;
  }
  for (let p = 0; p < N; p++) if (!near[p]) a[p * 4 + 3] = 0;
  return { any: kept > 0, keptShare: total ? kept / total : 0, faintShare: visible ? faint / visible : 1 };
}

// 배경이 지워진 PNG → 흰 테두리 스티커 (dataURL)
async function toSticker(cutBlob) {
  const url = URL.createObjectURL(cutBlob);
  const img = await loadImg(url);
  URL.revokeObjectURL(url);
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = canvas(W, H); const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  const id = x.getImageData(0, 0, W, H); const a = id.data;
  const m = cleanMask(a, W, H);
  if (!m.any) throw new Error('empty');
  x.putImageData(id, 0, 0);
  // 정리가 많이 일어났으면 음식을 제대로 못 잡은 사진이다
  lastWarn = m.keptShare < 0.6 || m.faintShare > 0.5;
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) {
    if (a[(y * W + i) * 4 + 3] > 0) { if (i < minX) minX = i; if (i > maxX) maxX = i; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const k = Math.min(1, 360 / Math.max(bw, bh));
  const w = Math.round(bw * k), h = Math.round(bh * k);
  const crop = canvas(w, h); crop.getContext('2d').drawImage(c, minX, minY, bw, bh, 0, 0, w, h);
  // 테두리용 실루엣은 반투명 없이 흰색/투명 두 가지로만 만든다 — 겹쳐 그려도 번지지 않게
  const sil = canvas(w, h); const sx = sil.getContext('2d');
  const sd = crop.getContext('2d').getImageData(0, 0, w, h); const d = sd.data;
  for (let i = 0; i < d.length; i += 4) { const on = d[i + 3] >= 128; d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = on ? 255 : 0; }
  sx.putImageData(sd, 0, 0);
  const P = 16, R = 9;
  const ring = canvas(w + P * 2, h + P * 2); const rx = ring.getContext('2d');
  for (let t = 0; t < Math.PI * 2; t += Math.PI / 16) rx.drawImage(sil, P + Math.cos(t) * R, P + Math.sin(t) * R);
  rx.drawImage(sil, P, P);
  const out = canvas(ring.width, ring.height); const ox = out.getContext('2d');
  ox.shadowColor = 'rgba(20,28,45,0.22)'; ox.shadowBlur = 8; ox.shadowOffsetY = 3;
  ox.drawImage(ring, 0, 0);
  ox.shadowColor = 'transparent';
  ox.drawImage(crop, P, P);
  return out.toDataURL('image/png');
}

/* ---------- 배경 제거 (기기 안에서 실행) ---------- */
let lib = null, modelReady = false;
// model: 'small'(기본, 약 52MB·빠름) | 'medium'(꼼꼼, 처음 약 84MB 더·서너 배 느림)
async function cutOut(blob, onProgress, model = 'small') {
  if (!lib) lib = await import('https://esm.sh/@imgly/background-removal@1.4.5');
  return lib.removeBackground(blob, {
    model,
    output: { format: 'image/png' },
    progress: (key, cur, total) => { if (key.startsWith('fetch')) onProgress?.(key, cur, total); },
  });
}



const MEALS = { breakfast: '아침', lunch: '점심', dinner: '저녁', snack: '간식' };
const WEEK = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
const WK = ['일', '월', '화', '수', '목', '금', '토'];
const NUM = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
const $ = (id) => document.getElementById(id);
const board = $('board');
const pad2 = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const hhmm = (d = new Date()) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const today0 = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const isToday = (d) => keyOf(d) === keyOf(new Date());
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let day = today0();
let stickers = [];
let selected = null;
let meal = guessMeal();
let newId = null;

function guessMeal() { const h = new Date().getHours(); return h < 10 ? 'breakfast' : h < 15 ? 'lunch' : h < 21 ? 'dinner' : 'snack'; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
const dayStickers = (d) => store.get('hanip:' + keyOf(d), []);
function load() { stickers = dayStickers(day); }
function save() { if (!store.set('hanip:' + keyOf(day), stickers)) { toast('이 휴대폰에 저장할 공간이 부족해요. 지난 날짜 스티커를 몇 개 떼어 주세요.'); return false; } return true; }

let toastTimer = null;
function toast(msg, action) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  const span = document.createElement('span'); span.textContent = msg; t.appendChild(span);
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); t.remove(); }; t.appendChild(b); }
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), action ? 4000 : 2600);
}

/* ---------- 오늘 다이어리 ---------- */
function mealCounts(list) {
  const c = {}; list.forEach((s) => { c[s.meal] = (c[s.meal] || 0) + 1; });
  return Object.keys(MEALS).filter((m) => c[m]).map((m) => `${MEALS[m]} ${c[m]}`).join(' · ');
}
function render() {
  const n = stickers.length, tod = isToday(day);
  $('heroTime').textContent = tod ? hhmm() : '지난 날';
  $('heroTitle').textContent = tod
    ? (n ? `오늘 ${NUM[n] || n}${n <= 10 ? ' 끼를' : '개를'} 붙였어요` : '오늘 다이어리가 아직 비어 있어요')

/* 여러 파일을 받는 진행률을 모아 전체 % 로 (작은 모델 약 52MB, 큰 모델 약 94MB) */
function aggProgress(expectMB, cb) {
  const files = {};
  return (key, cur, total) => {
    files[key] = [cur, total];
    let c = 0, t = 0; for (const [a, b] of Object.values(files)) { c += a; t += b; }
    cb(Math.min(99, Math.round(c / Math.max(t, expectMB * 1048576) * 100)));
  };
}

function addSticker(src) {

  const s = {
    id: Math.random().toString(36).slice(2, 9), src, meal, time: hhmm(),

/* ---------- 다이어리 한 장 이미지 (인스타 스토리 1080×1920) ---------- */
async function exportBoard() {
  const W = 1080, H = 1920, BX = 60, BY = 250, BW = 960, BH = 1280;
  const c = canvas(W, H); const x = c.getContext('2d');
  const font = getComputedStyle(document.body).fontFamily;
  x.fillStyle = '#F3F4F5'; x.fillRect(0, 0, W, H);
  x.save(); x.beginPath(); x.roundRect(BX, BY, BW, BH, 40); x.fillStyle = '#FFFFFF'; x.fill(); x.clip();
  x.strokeStyle = '#EEEFF1'; x.lineWidth = 2;
  for (let i = BX; i <= BX + BW; i += 48) { x.beginPath(); x.moveTo(i, BY); x.lineTo(i, BY + BH); x.stroke(); }
  for (let j = BY; j <= BY + BH; j += 48) { x.beginPath(); x.moveTo(BX, j); x.lineTo(BX + BW, j); x.stroke(); }
  x.restore();
  for (const s of stickers) {
    const img = await loadImg(s.src);
    const w = s.w * BW, h = w * img.naturalHeight / img.naturalWidth;
    x.save(); x.translate(BX + s.x * BW, BY + s.y * BH);
    x.save(); x.rotate(s.rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h); x.restore();
    const label = `${MEALS[s.meal]} ${s.time}`;
    x.font = `600 30px ${font}`;
    const tw = x.measureText(label).width + 40;
    x.fillStyle = '#1A1C20'; x.beginPath(); x.roundRect(-tw / 2, h / 2 - 26, tw, 46, 23); x.fill();
    x.fillStyle = '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(label, 0, h / 2 - 3);
    x.restore();
  }
  x.fillStyle = '#1A1C20'; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.font = `700 64px ${font}`; x.fillText($('dateText').textContent, BX, 190);
  x.fillStyle = '#555D6D'; x.font = `500 36px ${font}`; x.fillText('한입 스티커', BX, BY + BH + 90);
  return c.toDataURL('image/png');
}
async function shareImage(src, name) {
  const blob = await (await fetch(src)).blob();
  const file = new File([blob], name, { type: 'image/png' });
  if (!navigator.canShare || !navigator.canShare({ files: [file] })) { toast('이 화면에서는 공유창을 열 수 없어요. 이미지를 길게 눌러 저장해 주세요.'); return; }
  try { await navigator.share({ files: [file] }); }
  catch (err) { if (err && err.name !== 'AbortError') toast('공유하지 못했어요. 이미지를 길게 눌러 저장해 주세요.'); }
}

  $('storyBox').innerHTML = `<img src="${src}" alt="다이어리 이미지. 휴대폰에서는 길게 눌러 저장할 수 있어요">`;
  ctaButtons([
    ['저장하기', 'primary', () => {
      const a = document.createElement('a'); a.href = src; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      $('fileLine').innerHTML = `<span class="badge is-success">저장됨</span> ${name}`;
      toast('저장했어요. 안 보이면 이미지를 길게 눌러 저장해 주세요.');
    }],
    ['공유하기', 'secondary', () => shareImage(src, name)],
  ]);
};

/* ---------- 달력 ---------- */
function showCalendar(base = new Date(day)) {
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const t0 = today0();
  let count = 0, cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += '<span></span>';
  for (let d = 1; d <= last.getDate(); d++) {
    const dt = new Date(y, m, d); const list = dayStickers(dt);
    if (list.length) count++;
    const future = dt > t0;
    cells += `<button class="cal-cell${list.length ? ' has' : ''}${isToday(dt) ? ' is-today' : ''}" data-d="${d}" ${future || !list.length ? 'disabled' : ''} aria-label="${m + 1}월 ${d}일${list.length ? ', 기록 있음' : ''}"><span class="cal-n">${d}</span>${list.length ? `<img src="${list[0].src}" alt="">` : ''}</button>`;
  }
  const isThisMonth = y === t0.getFullYear() && m === t0.getMonth();
  showFlow(appbar(`${m + 1}월 달력`) + `
    <header class="hero"><h2 class="title">${count ? `${m + 1}월에 ${count}일 기록했어요` : `${m + 1}월에는 아직 기록이 없어요`}</h2></header>
    <main class="page"><section class="block">
      <div class="cal-head"><p class="h2">${y}년 ${m + 1}월</p><div>
        <button class="icon-btn" id="calPrev" aria-label="지난달">${ICON.prev}</button>
        <button class="icon-btn" id="calNext" aria-label="다음 달" ${isThisMonth ? 'disabled' : ''}>${ICON.next}</button></div></div>
      <div class="cal">${WK.map((w) => `<span class="cal-w">${w}</span>`).join('')}${cells}</div>
      <p class="week-note">그날 처음 붙인 스티커가 보여요</p>
    </section></main>`);
  document.querySelector('[data-flow-left]').onclick = hideFlow;
  $('calPrev').onclick = () => showCalendar(new Date(y, m - 1, 1));
  $('calNext').onclick = () => { if (!isThisMonth) showCalendar(new Date(y, m + 1, 1)); };
  document.querySelectorAll('.cal-cell[data-d]').forEach((b) => { b.onclick = () => { hideFlow(); setDay(new Date(y, m, +b.dataset.d)); }; });
}
$('calBtn').onclick = () => showCalendar();

/* ---------- 오려내기 기능 미리 받기 (처음 열 때) ----------
   라이브러리의 preload 는 모델 두 개와 실행 파일 전부(약 220MB)를 받는다.
   그래서 작은 그림 한 장을 실제로 오려 보며 필요한 것(약 52MB)만 받는다. */
let warming = null;
function warmUp() {
  if (store.get(MODEL_FLAG, false) || warming) return warming;
  $('dlBox').hidden = false;
  const prog = aggProgress(52, (p) => {
    $('dlText').textContent = `오려내기 기능 미리 받는 중 ${p}% · 처음 한 번만 · 약 50MB`;
    $('dlBar').style.width = p + '%';
  });
  warming = (async () => {
    try {
      const c = canvas(32, 32); const x = c.getContext('2d'); x.fillStyle = '#c33'; x.fillRect(8, 8, 16, 16);
      const blob = await new Promise((ok) => c.toBlob(ok, 'image/png'));
      await cutOut(blob, prog, 'small');
      modelReady = true; store.set(MODEL_FLAG, true);
    } catch (e) { console.warn('미리 받기 실패', e); }
    finally { $('dlBox').hidden = true; warming = null; }
  })();
  return warming;
}

/* 시험용: 브라우저 자동 점검에서 사진으로 바로 돌려 본다 */
window.__hanip = { makeSticker, addSticker, exportBoard, setDay, showCalendar, get stickers() { return stickers; } };

load(); render();
setInterval(() => { if (isToday(day)) $('heroTime').textContent = hhmm(); }, 30000);
warmUp();
</script>
